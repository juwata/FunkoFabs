spring.application.name=funkofabs-api
server.port=8080

# ========================================================
# ARQUIVO SEGURO - LIVRE DE SENHAS - PODE IR PARA O GITHUB
# ========================================================

# Essa linha diz para o Java: "Se existir um arquivo chamado application-secrets.properties,
# puxe as senhas dele. Se não existir, ignore e siga usando o H2 local abaixo".
spring.config.import=optional:classpath:application-secrets.properties

# JWT (Padrão para desenvolvimento local)
app.jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
app.jwt.expiration-ms=86400000

# Banco de Dados H2 (Em Memória - Para rodar sem senha e sem o Aiven)
spring.datasource.url=jdbc:h2:mem:funkodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
