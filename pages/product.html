<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/product.css">
    <title>FunkoFabs - Detalhes</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo-black.svg" id="header-logo" alt="">
            <nav class="pc">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="catalog.html">Catálogo</a></li>
                    <li><a href="create.html">Crie o seu</a></li>
                    <li><a href="../index.html#slide3">Avaliações</a></li>
                </ul>
            </nav>
        </div>
        <div class="pc actions">
            <a href="cart.html"><img src="../assets/icons/cart.svg" alt=""></a>
            <a href="perfil.html"><img src="../assets/icons/perfil.svg" alt=""></a>
        </div>
        <a href="nav.html" class="mb"><img src="../assets/icons/menu.svg" alt=""></a>
    </header>

    <main id="detalhes-produto">
        <!-- Adicionados IDs para manipulação segura pelo JavaScript -->
        <img src="../assets/images/placeholder.png" class="image" id="prod-img" alt="Imagem do Produto">

        <div class="cont">
            <section class="info">
                <h1 id="prod-nome">Carregando...</h1>
                <p id="prod-desc"></p>
            </section>
            <p class="price" id="prod-preco"></p>
            
            <form id="form-carrinho">
                <div class="inp-box">
                    <button type="button" id="btn-menos">-</button>
                    <p id="prod-qtd">1</p>
                    <button type="button" id="btn-mais">+</button>
                </div>
                <button type="submit" class="bt-icon bt-blue" id="btn-add-cart">
                    <img src="../assets/icons/addcart.svg" alt="">Adicionar ao carrinho
                </button>
            </form>
        </div>
    </main>

    <!-- Script principal da página de detalhes -->
    <script type="module" src="../js/pages/product.js"></script>
</body>
</html>
