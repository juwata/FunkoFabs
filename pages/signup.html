<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/form.css">
    <title>FunkoFabs</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo-black.svg" alt="">
            <nav class="pc">
                <ul>
                    <li><a href="#slide1">Início</a></li>
                    <li><a href="pages/catalog.html">Catálogo</a></li>
                    <li><a href="pages/create.html">Crie o seu</a></li>
                    <li><a href="#slide4">Avaliações</a></li>
                </ul>
            </nav>
        </div>
        <div class="pc actions">
            <a href=""><img src="../assets/icons/cart.svg" alt=""></a>
            <a href=""><img src="../assets/icons/perfil.svg" alt=""></a>
        </div>
        <a href="../pages/nav.html" class="mb"><img src="../assets/icons/menu.svg" alt=""></a>
    </header>

    <main class="signup">
        <section>
            <h1>cadastro</h1>
            <p>Entre já para o FabVerso!</p>
        </section>
        <form method="post">
            <div class="cam">
                <img src="../assets/icons/cam.svg" alt="">
                <p>Escolha sua melhor foto! <br> (ou não também)</p>
            </div>
            <input type="text" required placeholder="Nome completo" autocapitalize autofocus autocomplete="name">
            <input type="email" required placeholder="E-mail" autocomplete="email">
            <input type="password" required placeholder="Senha" autocomplete="new-password">
            <input type="tel" required placeholder="Telefone" autocomplete="tel">
            <select id="payment" required>
                <option hidden value="">Forma de pagamento</option>
                <option value="pix">Pix</option>
            </select>
            <button type="submit" class="bt-blue">Confirmar</button>
        </form>
    </main>
    <a href="login.html" class="downlink">Já possui conta? Faça seu login!</a>
</body>
</html>
