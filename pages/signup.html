<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/form.css">
    <script type="module" src="../js/pages/signup.js" defer></script>
    <title>FunkoFabs</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo-black.svg" id="header-logo" alt="Logotipo FunkoFabs">
            <nav class="pc">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="catalog.html">Catálogo</a></li>
                    <li><a href="create.html">Crie o seu</a></li>
                    <li><a href="../index.html#slide3">Avaliações</a></li>
                </ul>
            </nav>
        </div>
        <div class="pc actions">
            <a href="cart.html" aria-label="Ir para o Carrinho"><img src="../assets/icons/cart.svg" alt=""></a>
            <a href="perfil.html" aria-label="Ir para o Perfil"><img src="../assets/icons/perfil.svg" alt=""></a>
        </div>
        <a href="nav.html" class="mb" aria-label="Abrir Menu de Navegação"><img src="../assets/icons/menu.svg" alt=""></a>
    </header>

    <main class="signup">
        <section>
            <h1>cadastro</h1>
            <p>Entre já para o FabVerso!</p>
        </section>
        <form id="form-cadastro">
            <label class="cam" id="container-foto" for="input-foto" style="cursor: pointer;" title="Clique para escolher uma foto">
                <input type="file" id="input-foto" accept="image/*" style="display: none;">
                <img src="../assets/icons/cam.svg" id="preview-foto" alt="Sua foto de perfil">
                <p id="texto-foto">Escolha sua melhor foto! <br> (ou não também)</p>
            </label>
            <button type="button" id="btn-remover-foto" style="display: none; background: transparent; border: none; color: #ff4d4d; cursor: pointer; font-size: 14px; text-decoration: underline; margin-top: -15px; margin-bottom: 15px;">Remover foto</button>
            <input type="text" required placeholder="Nome completo" autocapitalize autofocus autocomplete="name">
            <input type="email" required placeholder="E-mail" autocomplete="email">
            <input type="password" required placeholder="Senha" autocomplete="new-password">
            <input type="tel" id="iTel" required placeholder="Telefone" autocomplete="tel">
            <select id="payment" required>
                <option hidden value="">Forma de pagamento</option>
                <option value="pix">Pix</option>
            </select>
            <button type="button" id="btn-submit-form" class="bt-blue">Confirmar</button>
        </form>
    </main>
    <a href="login.html" class="downlink">Já possui conta? Faça seu login!</a>
    <script src="../scripts/script.js"></script>
    <!-- Início do VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do VLibras -->
    <!-- Início do UserWay -->
    <script src="https://cdn.userway.org/widget.js" data-account="p9xWdK9B2g" data-position="3"></script>
    <!-- Fim do UserWay -->
</body>
</html>
