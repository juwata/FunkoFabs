<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/perfil.css">
    <title>FunkoFabs</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo-black.svg" id="header-logo" alt="Logotipo FunkoFabs">
            <nav class="pc">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="catalog.html">Catálogo</a></li>
                    <li><a href="create.html">Crie o seu</a></li>
                    <li><a href="../index.html#slide3">Avaliações</a></li>
                </ul>
            </nav>
        </div>
        <div class="pc actions">
            <a href="cart.html" aria-label="Ir para o Carrinho"><img src="../assets/icons/cart.svg" alt=""></a>
            <a href="perfil.html" aria-label="Ir para o Perfil"><img src="../assets/icons/perfil.svg" alt=""></a>
        </div>
        <a href="nav.html" class="mb" aria-label="Abrir Menu de Navegação"><img src="../assets/icons/menu.svg" alt=""></a>
    </header>

    <div class="title">
            <h1>Perfil</h1>
            <p>Nossa, que pessoa bonita você é!</p>
    </div>

    <main>
        <img src="../assets/images/FabsCadeirante.webp" id="foto-perfil" alt="Sua foto" style="cursor: pointer;" title="Clique para trocar sua foto">
        <input type="file" id="input-foto" accept="image/*" style="display: none;">

        <section>
            <div class="personal">
                <img src="../assets/icons/perfil.svg" alt="">
                <h3>Informações pessoais</h3>
            </div>
            <form method="post">
                <input type="text" placeholder="Nome completo">
                <input type="email" placeholder="Email">
                <input type="tel" id="iTel" placeholder="Telefone" maxlength="15">
                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <button type="submit" class="bt-blue">Confirmar</button>
                    <button type="button" id="btn-logout" class="bt-out" style="color: var(--pri); border-color: var(--pri);">Sair da conta</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../scripts/script.js"></script>
    <script type="module" src="../js/pages/perfil.js"></script>
    <!-- Início do VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do VLibras -->
    <!-- Início do UserWay -->
    <script src="https://cdn.userway.org/widget.js" data-account="p9xWdK9B2g" data-position="3"></script>
    <!-- Fim do UserWay -->
</body>
</html>
