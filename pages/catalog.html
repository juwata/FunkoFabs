<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../assets/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/catalog.css">
    <script type="module" src="../js/pages/catalog.js" defer></script>
    <title>FunkoFabs</title>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../assets/logo-black.svg" id="header-logo" alt="Logotipo FunkoFabs">
            <nav class="pc">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="catalog.html">Catálogo</a></li>
                    <li><a href="create.html">Crie o seu</a></li>
                    <li><a href="../index.html#slide3">Avaliações</a></li>
                </ul>
            </nav>
        </div>
        <div class="pc actions">
            <a href="cart.html" aria-label="Ir para o Carrinho"><img src="../assets/icons/cart.svg" alt=""></a>
            <a href="perfil.html" aria-label="Ir para o Perfil"><img src="../assets/icons/perfil.svg" alt=""></a>
        </div>
        <a href="nav.html" class="mb" aria-label="Abrir Menu de Navega��o"><img src="../assets/icons/menu.svg" alt=""></a>
    </header>

    <div class="title">
        <h1>Catálogo</h1>
        <p>Uma vitrine para ver todos produtos!</p>
    </div>

    <section class="filters">
        <div class="search">
            <input type="text" id="search-input" aria-label="Buscar produtos">
            <label for="search-input"><img src="../assets/icons/magglass.svg" alt=""></label>
        </div>

        <div class="select">
            <label for="select-select" class="select-label"><img src="../assets/icons/filter.svg" alt=""></label>
            <input type="checkbox" id="select-select" class="sr-only" aria-label="Abrir opções de filtro">
            <select id="sort-select" aria-label="Ordenar produtos por">
                <option value="">Todos</option>
                <option value="preco-asc">Menor Preço</option>
                <option value="preco-desc">Maior Preço</option>
                <option value="nome-asc">A - Z</option>
                <option value="nome-desc">Z - A</option>
            </select>
        </div>
    </section>

    <main id="vitrine">
    </main>

    <script src="../scripts/script.js"></script>
    <!-- Início do VLibras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <!-- Fim do VLibras -->
    <!-- Início do UserWay -->
    <script src="https://cdn.userway.org/widget.js" data-account="p9xWdK9B2g" data-position="3"></script>
